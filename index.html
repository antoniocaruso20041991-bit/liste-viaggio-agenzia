<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />

  <title>Liste Viaggio — Agenzia Viaggi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

      <h1 class="text-3xl font-bold text-slate-900 mb-1">TRAVELBUY</h1>

    <div id="main-content" class="bg-white rounded-xl shadow-md p-6">
      <p class="text-center text-slate-600">Caricamento in corso...</p>
    </div>
  </div>

  <script>
    // Applicazione Frontend semplice e immediata
    async function init() {
      const app = document.getElementById('main-content');
      app.innerHTML = `
        <div class="text-center py-8">
          <h2 class="text-2xl font-bold text-slate-800 mb-4">Piattaforma Liste Viaggio Attiva</h2>
          <p class="text-slate-600 mb-6">Il database Supabase e l'infrastruttura Vercel sono pronti per ricevere i dati.</p>

    }
    init();
